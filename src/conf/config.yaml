defaults:
  - dataset: default
  - model: default
  - training: default
  - _self_

datamodule:
  _target_: src.activations.ActivationDataModule
  data_dir: ${dataset.data_dir}
  batch_size: ${training.batch_size}  
  split_ratios: ${dataset.split_ratios}
  dtype: ${dataset.dtype}
  num_workers: 4
  seed: ${training.seed}

hydra:
  run:
    dir: ${oc.env:SAE_PROJECT_ROOT,${hydra:runtime.cwd}}/outputs/runtime/${training.logging.run_name}/${now:%Y%m%d-%H%M%S}
