[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modernbert-sparse-autoencoder"
version = "0.1.0"
description = "Sparse autoencoder experiments for interpreting a ModernBERT text classifier"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "transformers>=4.48,<5",
    "lightning>=2.4",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<3",
    "pydantic-settings>=2.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "PyYAML>=6",
    "wordcloud>=1.9",
]

[project.optional-dependencies]
frontend = ["streamlit>=1.40", "plotly>=5.24"]
explain = ["openai>=1.50"]
serve = ["vllm>=0.8; sys_platform == 'linux'"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "tabulate>=0.9", "requests>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
src = ["conf/**/*.yaml", "utils/vllm/*.yaml", "utils/vllm/*.sh", "frontend/*.sh", "frontend/components/css/*.css"]
